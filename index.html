<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>倒數計時器</title>
    <link rel="stylesheet" href="styles/normalize.css" />
    <link rel="stylesheet" href="styles/style.css" />
    <script src="scripts/app.js" defer></script>
  </head>
  <body>
    <main class="countdown-timer">
      <section class="timer" aria-live="polite">02:00</section>
      <div class="progress" aria-hidden="true">
        <div class="progress-bar"></div>
      </div>
      <form class="time-form" id="timeForm">
        <label>
          分
          <input type="number" id="minutesInput" min="0" max="99" value="2" />
        </label>
        <label>
          秒
          <input type="number" id="secondsInput" min="0" max="59" value="0" />
        </label>
        <button type="submit" id="setTimeBtn">設定</button>
      </form>
      <section class="hint">按下 Enter 開始倒數，空白鍵可暫停</section>
    </main>
  </body>
</html>
